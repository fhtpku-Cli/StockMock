name: 代码验证

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试与检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 安装 uv 与 Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.12"
          python-version: "3.12"
      - name: 按锁文件安装依赖
        run: uv sync --frozen
      - name: 运行行为测试
        run: uv run --frozen python -m pytest
      - name: 检查全部类型
        run: uv run --frozen basedpyright
      - name: 检查代码规范
        run: uv run --frozen ruff check app tests typings
      - name: 检查格式
        run: uv run --frozen ruff format --check app tests typings

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: 按锁文件安装依赖
        run: bun install --frozen-lockfile
      - name: 运行单元测试
        run: bun run test
      - name: 检查类型并构建
        run: bun run build
